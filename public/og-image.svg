<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B4F1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle pattern dots -->
  <circle cx="100" cy="100" r="80" fill="white" opacity="0.03"/>
  <circle cx="1100" cy="530" r="120" fill="white" opacity="0.03"/>
  <circle cx="900" cy="80" r="60" fill="white" opacity="0.03"/>

  <!-- Mascot (scaled up from favicon) -->
  <g transform="translate(160, 115) scale(5)">
    <!-- Spines -->
    <polygon points="32,2 26,18 38,18" fill="url(#sg)"/>
    <polygon points="16,6 15,22 28,19" fill="url(#sg)"/>
    <polygon points="48,6 49,22 36,19" fill="url(#sg)"/>
    <polygon points="6,16 10,30 22,24" fill="url(#sg)"/>
    <polygon points="58,16 54,30 42,24" fill="url(#sg)"/>

    <!-- Body -->
    <ellipse cx="32" cy="40" rx="22" ry="20" fill="#8B6914"/>

    <!-- Face -->
    <ellipse cx="32" cy="38" rx="16" ry="15" fill="#F5DEB3"/>

    <!-- Eyes -->
    <ellipse cx="26" cy="34" rx="4" ry="4.5" fill="white"/>
    <ellipse cx="38" cy="34" rx="4" ry="4.5" fill="white"/>
    <circle cx="27" cy="33.5" r="2.5" fill="#2D1B00"/>
    <circle cx="39" cy="33.5" r="2.5" fill="#2D1B00"/>
    <circle cx="27.8" cy="32.5" r="1" fill="white"/>
    <circle cx="39.8" cy="32.5" r="1" fill="white"/>

    <!-- Nose -->
    <ellipse cx="32" cy="39" rx="2" ry="1.5" fill="#2D1B00"/>

    <!-- Smile -->
    <path d="M27,42 Q32,48 37,42" fill="none" stroke="#2D1B00" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="21" cy="41" r="3" fill="#FFB6C1" opacity="0.5"/>
    <circle cx="43" cy="41" r="3" fill="#FFB6C1" opacity="0.5"/>

    <!-- Helmet -->
    <path d="M18,30 Q18,20 32,17 Q46,20 46,30" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="32" cy="16" r="2.5" fill="#00D4FF"/>
    <circle cx="32" cy="16" r="1.2" fill="white"/>
  </g>

  <!-- Title text -->
  <text x="620" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="start">Digitalna</text>
  <text x="620" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="start">bezbednost</text>
  <text x="620" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#fde047" text-anchor="start">sa Kiberkom</text>

  <!-- Subtitle -->
  <text x="620" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="white" opacity="0.85" text-anchor="start">Nauci kako da budes bezbedan na internetu!</text>

  <!-- Shield icon near subtitle -->
  <text x="580" y="485" font-size="32" fill="white" opacity="0.85">&#x1F6E1;</text>
</svg>
