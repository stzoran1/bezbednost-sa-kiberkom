<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="keyBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B0E0FF"/>
    </linearGradient>
    <linearGradient id="keyHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F4FF"/>
      <stop offset="100%" stop-color="#B0E0FF"/>
    </linearGradient>
  </defs>
  <!-- Key head (circular bow) -->
  <circle cx="20" cy="20" r="14" fill="url(#keyHead)" opacity="0.95"/>
  <!-- Key head inner cutout -->
  <circle cx="20" cy="20" r="7" fill="#00D4FF" opacity="0.25"/>
  <!-- Key head highlight -->
  <ellipse cx="16" cy="15" rx="5" ry="6" fill="white" opacity="0.3" transform="rotate(-15 16 15)"/>
  <!-- Key head rim -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <!-- Key shaft -->
  <rect x="32" y="17" width="24" height="6" rx="3" fill="url(#keyBody)" opacity="0.95"/>
  <!-- Shaft highlight -->
  <rect x="34" y="18" width="18" height="2" rx="1" fill="white" opacity="0.3"/>
  <!-- Key teeth -->
  <rect x="48" y="23" width="4" height="8" rx="1" fill="url(#keyBody)" opacity="0.95"/>
  <rect x="42" y="23" width="3" height="6" rx="1" fill="url(#keyBody)" opacity="0.95"/>
  <!-- Teeth highlights -->
  <rect x="49" y="24" width="1.5" height="4" rx="0.5" fill="white" opacity="0.3"/>
  <rect x="43" y="24" width="1" height="3" rx="0.5" fill="white" opacity="0.3"/>
  <!-- Shaft rim -->
  <rect x="32" y="17" width="24" height="6" rx="3" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <!-- Cyber sparkle on key head -->
  <circle cx="20" cy="20" r="3" fill="#00D4FF" opacity="0.35"/>
  <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.5"/>
</svg>
