<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lockBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="lockShackle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="lockGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <rect x="12" y="14" width="40" height="44" rx="6" fill="#FFD700" opacity="0.25" filter="url(#lockGlow)"/>
  <!-- Shackle -->
  <path d="M20 28V20a12 12 0 0 1 24 0v8" fill="none" stroke="url(#lockShackle)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Shackle highlight -->
  <path d="M22 28V20a10 10 0 0 1 20 0v8" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Lock body -->
  <rect x="14" y="28" width="36" height="28" rx="5" fill="url(#lockBody)"/>
  <!-- Body highlight -->
  <rect x="16" y="30" width="32" height="8" rx="3" fill="white" opacity="0.35"/>
  <!-- Keyhole circle -->
  <circle cx="32" cy="40" r="5" fill="white" opacity="0.9"/>
  <!-- Keyhole slot -->
  <path d="M32 44v6" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Keyhole inner -->
  <circle cx="32" cy="40" r="2.5" fill="#FF8C00"/>
  <!-- Body rim -->
  <rect x="14" y="28" width="36" height="28" rx="5" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
</svg>
