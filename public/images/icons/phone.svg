<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="phoneGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <rect x="14" y="2" width="36" height="60" rx="8" fill="#7C4DFF" opacity="0.25" filter="url(#phoneGlow)"/>
  <!-- Phone body -->
  <rect x="16" y="4" width="32" height="56" rx="6" fill="url(#phoneBody)"/>
  <!-- Screen -->
  <rect x="20" y="12" width="24" height="34" rx="2" fill="url(#phoneScreen)"/>
  <!-- Screen shield icon -->
  <path d="M32 18l-7 4v5c0 4.5 3 8.5 7 9.5 4-1 7-5 7-9.5v-5l-7-4z" fill="white" opacity="0.85"/>
  <path d="M29 28l2.5 2.5 4.5-5" fill="none" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top notch/speaker -->
  <rect x="27" y="7" width="10" height="2" rx="1" fill="#00E5FF" opacity="0.8"/>
  <!-- Home button circle -->
  <circle cx="32" cy="52" r="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Body highlight -->
  <rect x="18" y="6" width="10" height="20" rx="3" fill="white" opacity="0.15"/>
  <!-- Body rim -->
  <rect x="16" y="4" width="32" height="56" rx="6" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
</svg>
